<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Goal App</title>
<meta name="theme-color" content="#0B0B10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Goal App" />
<link rel="apple-touch-icon" id="appleicon" />
<link rel="manifest" id="manifest" />
<style>
  :root{
    --bg:#0B0B10; --surface:#15151C; --surface2:#1D1D26; --border:#2A2A36;
    --text:#F2F2F5; --dim:#8B8B99; --faint:#5A5A68; --accent:#7C6BFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;}
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;}
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(14px + env(safe-area-inset-top)) 18px 24px;}
  h1{font-size:26px;font-weight:700;margin:0 0 2px;}
  .sectitle{font-size:12.5px;color:var(--dim);font-weight:600;margin:22px 0 10px;letter-spacing:.2px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;
    animation:rise .35s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .bar{height:7px;background:var(--border);border-radius:999px;overflow:hidden;}
  .bar>span{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.4,0,.2,1);}
  .medal{width:var(--s,24px);height:var(--s,24px);border-radius:999px;display:inline-flex;
    align-items:center;justify-content:center;flex:0 0 auto;}
  .medal>i{width:36%;height:36%;border-radius:999px;display:block;}
  button,.btn{font-family:inherit;cursor:pointer;}
  .ghost{width:100%;margin-top:16px;background:none;border:1px solid var(--border);color:var(--dim);
    border-radius:12px;padding:12px;font-size:13.5px;font-weight:600;display:flex;align-items:center;
    justify-content:center;gap:6px;}
  /* nav */
  .nav{flex:0 0 auto;height:calc(60px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:rgba(11,11,16,.95);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--border);display:flex;z-index:20;}
  .nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
    gap:3px;padding-top:8px;color:var(--faint);font-size:10.5px;font-weight:600;}
  .nav button.on{color:var(--text);}
  .nav .ic{font-size:20px;line-height:1;filter:grayscale(1) opacity(.6);}
  .nav button.on .ic{filter:none;}
  /* tree node */
  .node{position:relative;}
  .node .link{position:absolute;left:21px;top:-13px;height:13px;width:2px;}
  .nodebtn{width:100%;text-align:left;display:flex;align-items:center;gap:12px;border-radius:16px;
    padding:12px;margin-bottom:10px;border:1.5px solid;background:var(--surface);}
  .dot{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;}
  .dcard{width:calc(50% - 6px);background:var(--surface);border:1px solid var(--border);border-radius:18px;
    padding:15px;min-height:134px;display:flex;flex-direction:column;text-align:left;color:var(--text);}
  .dcard:disabled{opacity:.45;}
  .swatch{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .swatch>i{width:12px;height:12px;border-radius:4px;display:block;}
  .pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;}
  svg.i{display:block;}
  /* sheet */
  .sheetwrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .25s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{position:relative;background:var(--surface);border-top:1px solid var(--border);
    border-radius:26px 26px 0 0;padding:20px 20px calc(28px + env(safe-area-inset-bottom));
    animation:up .32s cubic-bezier(.2,.8,.2,1);max-width:520px;margin:0 auto;width:100%;}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  input[type=number]{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;
    padding:13px 14px;color:var(--text);font-size:20px;font-weight:700;outline:none;font-family:inherit;}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .primary{width:100%;margin-top:20px;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;}
  .iconbtn{background:var(--surface2);border:none;border-radius:999px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
  /* overlay */
  #overlay{position:fixed;inset:0;pointer-events:none;z-index:60;max-width:520px;margin:0 auto;}
  .confetti{position:absolute;top:42%;left:50%;}
  .confetti span{position:absolute;width:9px;height:9px;border-radius:2px;opacity:1;
    animation:burst .95s cubic-bezier(.2,.8,.3,1) forwards;}
  @keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(220deg);opacity:0;}}
  .toast{position:absolute;top:calc(24px + env(safe-area-inset-top));left:18px;right:18px;
    background:#161620;border:1px solid var(--accent);border-radius:16px;padding:14px;
    display:flex;align-items:center;gap:12px;animation:tin .4s ease;}
  @keyframes tin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .toast .k{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.4px;}
  .toast .v{font-size:17px;font-weight:700;}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script>
/* ============================ DATA (config) ============================ */
var TIER_XP={1:100,2:250,3:600,4:1500,5:4000};
var DOMAINS=[
  {id:"business",label:"Business",accent:"#7C6BFF",active:true,ic:"💼"},
  {id:"finances",label:"Finances",accent:"#35C08A",active:true,ic:"💰"},
  {id:"physique",label:"Physique",accent:"#FF6B6B",active:false,ic:"🥊"},
  {id:"competences",label:"Compétences",accent:"#4AA8FF",active:false,ic:"🎯"},
  {id:"personnel",label:"Personnel",accent:"#E36BB0",active:false,ic:"🏡"},
  {id:"lifestyle",label:"Lifestyle",accent:"#E0B341",active:false,ic:"🌴"},
];
var GROUP_ORDER={
  business:["Légendaire","Fondation","Bénéfice mensuel","Développement"],
  finances:["Légendaire","Patrimoine","Revenus mensuels"],
};
var OBJECTIVES=[
  {id:"biz_societe",d:"business",group:"Fondation",title:"Société créée",type:"event",tier:2,prereqs:[]},
  {id:"biz_fourn",d:"business",group:"Fondation",title:"Premier fournisseur",type:"event",tier:1,prereqs:["biz_societe"]},
  {id:"biz_cmd",d:"business",group:"Fondation",title:"Première commande",type:"event",tier:1,prereqs:["biz_fourn"]},
  {id:"biz_vente",d:"business",group:"Fondation",title:"Première vente Amazon",type:"event",tier:2,prereqs:["biz_cmd"]},
  {id:"biz_rentable",d:"business",group:"Fondation",title:"Premier mois rentable",type:"event",tier:3,prereqs:["biz_vente"]},
  {id:"biz_10sku",d:"business",group:"Développement",title:"10 SKU actifs",type:"metric",tier:2,target:10,unit:"SKU",prereqs:["biz_vente"]},
  {id:"biz_25sku",d:"business",group:"Développement",title:"25 SKU actifs",type:"metric",tier:2,target:25,unit:"SKU",prereqs:["biz_10sku"]},
  {id:"biz_50sku",d:"business",group:"Développement",title:"50 SKU actifs",type:"metric",tier:3,target:50,unit:"SKU",prereqs:["biz_25sku"]},
  {id:"biz_100sku",d:"business",group:"Développement",title:"100 SKU actifs",type:"metric",tier:4,target:100,unit:"SKU",prereqs:["biz_50sku"]},
  {id:"biz_b1000",d:"business",group:"Bénéfice mensuel",title:"1 000 € / mois",type:"metric",tier:2,target:1000,unit:"€",prereqs:["biz_vente"]},
  {id:"biz_b2500",d:"business",group:"Bénéfice mensuel",title:"2 500 € / mois",type:"metric",tier:2,target:2500,unit:"€",prereqs:["biz_b1000"]},
  {id:"biz_b5000",d:"business",group:"Bénéfice mensuel",title:"5 000 € / mois",type:"metric",tier:3,target:5000,unit:"€",prereqs:["biz_b2500"]},
  {id:"biz_b10000",d:"business",group:"Bénéfice mensuel",title:"10 000 € / mois",type:"metric",tier:4,target:10000,unit:"€",prereqs:["biz_b5000"]},
  {id:"biz_b100000",d:"business",group:"Légendaire",title:"100 000 € / mois",type:"metric",tier:5,target:100000,unit:"€",prereqs:["biz_b10000"],legendary:true},
  {id:"fin_p10k",d:"finances",group:"Patrimoine",title:"10 000 €",type:"metric",tier:2,target:10000,unit:"€",prereqs:[]},
  {id:"fin_p25k",d:"finances",group:"Patrimoine",title:"25 000 €",type:"metric",tier:2,target:25000,unit:"€",prereqs:["fin_p10k"]},
  {id:"fin_p50k",d:"finances",group:"Patrimoine",title:"50 000 €",type:"metric",tier:3,target:50000,unit:"€",prereqs:["fin_p25k"]},
  {id:"fin_p100k",d:"finances",group:"Patrimoine",title:"100 000 €",type:"metric",tier:4,target:100000,unit:"€",prereqs:["fin_p50k"]},
  {id:"fin_p500k",d:"finances",group:"Patrimoine",title:"500 000 €",type:"metric",tier:5,target:500000,unit:"€",prereqs:["fin_p100k"]},
  {id:"fin_r1000",d:"finances",group:"Revenus mensuels",title:"1 000 € / mois",type:"metric",tier:2,target:1000,unit:"€",prereqs:[]},
  {id:"fin_r2500",d:"finances",group:"Revenus mensuels",title:"2 500 € / mois",type:"metric",tier:2,target:2500,unit:"€",prereqs:["fin_r1000"]},
  {id:"fin_r5000",d:"finances",group:"Revenus mensuels",title:"5 000 € / mois",type:"metric",tier:3,target:5000,unit:"€",prereqs:["fin_r2500"]},
  {id:"fin_r10000",d:"finances",group:"Revenus mensuels",title:"10 000 € / mois",type:"metric",tier:4,target:10000,unit:"€",prereqs:["fin_r5000"]},
  {id:"fin_p1m",d:"finances",group:"Légendaire",title:"1 000 000 € patrimoine",type:"metric",tier:5,target:1000000,unit:"€",prereqs:["fin_p500k"],legendary:true},
];
var TITLES=[
  {id:"t_biz_1",scope:"business",label:"Revendeur",rank:1,needObj:"biz_vente"},
  {id:"t_biz_2",scope:"business",label:"Grossiste",rank:2,needObj:"biz_b2500"},
  {id:"t_biz_3",scope:"business",label:"Distributeur",rank:3,needObj:"biz_b10000"},
  {id:"t_biz_4",scope:"business",label:"Empire Commercial",rank:4,needObj:"biz_b100000"},
  {id:"t_fin_1",scope:"finances",label:"Épargnant",rank:1,needObj:"fin_p10k"},
  {id:"t_fin_2",scope:"finances",label:"Investisseur",rank:2,needObj:"fin_p50k"},
  {id:"t_fin_3",scope:"finances",label:"Rentier",rank:3,needObj:"fin_p100k"},
  {id:"t_fin_4",scope:"finances",label:"Magnat",rank:4,needObj:"fin_p1m"},
  {id:"t_g_1",scope:"global",label:"Novice",rank:1,needPct:0},
  {id:"t_g_2",scope:"global",label:"Bâtisseur",rank:2,needPct:0.15},
  {id:"t_g_3",scope:"global",label:"Vétéran",rank:3,needPct:0.35},
  {id:"t_g_4",scope:"global",label:"Légende",rank:4,needPct:0.60},
];
var MEDAL={bronze:{label:"Bronze",color:"#C97B4A"},silver:{label:"Argent",color:"#B8C0CC"},
  gold:{label:"Or",color:"#E0B341"},diamond:{label:"Diamant",color:"#5FD3E8"}};
var MRANK=["bronze","silver","gold","diamond"];

// Ardoise vierge : aucune tâche pré-validée. Jean remplit ses vraies réussites.
var INITIAL={};
var INITIAL_LOG=[];

var objById={},domById={};
OBJECTIVES.forEach(function(o){objById[o.id]=o;});
DOMAINS.forEach(function(d){domById[d.id]=d;});

/* ============================ LOGIC ============================ */
function statusOf(o,p){var x=p[o.id]||{};if(x.done)return"completed";
  var ok=o.prereqs.every(function(id){return p[id]&&p[id].done;});
  if(!ok)return"locked";if(o.type==="metric"&&(x.value||0)>0)return"in_progress";return"available";}
function medalForValue(o,v){var r=v/(o.target||1);if(r>=2)return"diamond";if(r>=1.5)return"gold";
  if(r>=1.15)return"silver";if(r>=1)return"bronze";return null;}
function pctOf(o,p){var x=p[o.id]||{};if(x.done)return 1;
  if(o.type==="metric")return Math.min((x.value||0)/(o.target||1),1);return 0;}
function globalPct(p){var d=0,t=0;OBJECTIVES.forEach(function(o){var b=TIER_XP[o.tier];t+=b;
  if(p[o.id]&&p[o.id].done)d+=b;});return t?d/t:0;}
function unlockedTitleIds(p){var gp=globalPct(p);return TITLES.filter(function(t){
  return t.scope==="global"?gp>=(t.needPct||0):(p[t.needObj]&&p[t.needObj].done);}).map(function(t){return t.id;});}
function currentTitle(scope,p){var gp=globalPct(p);
  var c=TITLES.filter(function(t){return t.scope===scope;}).filter(function(t){
    return t.scope==="global"?gp>=(t.needPct||0):(p[t.needObj]&&p[t.needObj].done);});
  if(!c.length)return null;c.sort(function(a,b){return b.rank-a.rank;});return c[0].label;}
function fmt(n,u){return u==="€"?new Intl.NumberFormat("fr-FR").format(Math.round(n))+" €":
  (Math.round(n)+" "+(u||"")).trim();}

/* ============================ STATE + PERSIST ============================ */
var KEY="goalapp-v2";
function load(){try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&r.progress)return r;}catch(e){}
  return{progress:JSON.parse(JSON.stringify(INITIAL)),log:INITIAL_LOG.slice()};}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({progress:state.progress,log:state.log}));}catch(e){}}
var saved=load();
var state={progress:saved.progress,log:saved.log,tab:"home",domain:null,sheet:null};

/* ============================ ICONS ============================ */
function svg(path,color,size,fill){size=size||18;color=color||"currentColor";
  return '<svg class="i" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="'+(fill||"none")+
    '" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>';}
var IC={
  check:function(c,s){return svg('<path d="M20 6 9 17l-5-5"/>',c,s);},
  lock:function(c,s){return svg('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',c,s);},
  target:function(c,s){return svg('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',c,s);},
  chev:function(c,s){return svg('<path d="m9 18 6-6-6-6"/>',c,s);},
  x:function(c,s){return svg('<path d="M18 6 6 18M6 6l12 12"/>',c,s);},
  back:function(c,s){return svg('<path d="m12 19-7-7 7-7M19 12H5"/>',c,s);},
};
function medalChip(tier,size){if(!tier||!MEDAL[tier])return"";var m=MEDAL[tier];
  return '<span class="medal" style="--s:'+(size||24)+'px;background:'+m.color+'22;border:1.5px solid '+m.color+
    '"><i style="background:'+m.color+'"></i></span>';}

/* ============================ VIEWS ============================ */
function esc(s){return String(s);}
function bar(pct,color){return '<div class="bar"><span style="width:'+Math.round(pct*100)+'%;background:'+color+'"></span></div>';}

function viewHome(){
  var p=state.progress,gp=globalPct(p),gt=currentTitle("global",p);
  var legend=OBJECTIVES.filter(function(o){return o.legendary;});
  var wins=state.log.map(function(id){return objById[id];}).filter(Boolean).slice(0,3);
  var medals=OBJECTIVES.filter(function(o){return p[o.id]&&p[o.id].done&&p[o.id].medal;})
    .map(function(o){return{o:o,m:p[o.id].medal};})
    .sort(function(a,b){return MRANK.indexOf(b.m)-MRANK.indexOf(a.m);}).slice(0,8);
  var doneCount=OBJECTIVES.filter(function(o){return p[o.id]&&p[o.id].done;}).length;
  var dp=DOMAINS.filter(function(d){return d.active;}).map(function(d){
    var objs=OBJECTIVES.filter(function(o){return o.d===d.id;});
    return{d:d,r:objs.filter(function(o){return p[o.id]&&p[o.id].done;}).length/objs.length};})
    .sort(function(a,b){return b.r-a.r;});
  var r=(52-9)/2,circ=2*Math.PI*r,off=circ*(1-gp);
  var html='';
  // hero ring
  html+='<div style="display:flex;flex-direction:column;align-items:center;margin-bottom:4px">';
  html+='<div style="position:relative;width:130px;height:130px;display:flex;align-items:center;justify-content:center">';
  html+='<svg width="130" height="130" style="position:absolute;transform:rotate(-90deg)">'+
    '<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="9"/>'+
    '<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" '+
    'stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" style="transition:stroke-dashoffset .9s ease"/></svg>';
  html+='<div style="position:absolute;text-align:center"><div style="font-size:28px;font-weight:700">'+Math.round(gp*100)+'%</div>'+
    '<div style="font-size:10px;color:var(--dim);letter-spacing:1px;font-weight:700">PROGRESSION</div></div></div>';
  html+='<div style="display:flex;align-items:center;gap:8px;margin-top:14px"><span style="font-size:18px">👑</span>'+
    '<span style="font-size:21px;font-weight:700">'+esc(gt)+'</span></div></div>';
  // empty state
  if(doneCount===0){html+='<div class="card" style="margin-top:18px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.6">'+
    'Aucun objectif validé pour l\'instant.<br>Ouvre <b style="color:var(--text)">Domaines</b> et valide tes premières réussites.</div>';}
  // wins
  if(wins.length){
    html+='<div class="sectitle">Dernières grandes réussites</div>';
    wins.forEach(function(o){html+='<div class="card row" style="margin-bottom:8px">'+medalChip(p[o.id].medal)+
      '<span style="flex:1;font-size:14.5px;font-weight:500">'+esc(o.title)+'</span>'+
      '<span style="font-size:12px;color:var(--faint)">'+domById[o.d].label+'</span></div>';});
  }
  // legendary
  html+='<div class="sectitle">Objectifs légendaires</div>';
  legend.forEach(function(o){var pc=pctOf(o,p),ac=domById[o.d].accent;
    html+='<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+
      '<span style="font-size:15px">⭐</span><span style="flex:1;font-size:14.5px;font-weight:600">'+esc(o.title)+'</span>'+
      '<span style="font-size:13px;color:'+ac+';font-weight:700">'+Math.round(pc*100)+'%</span></div>'+bar(pc,ac)+'</div>';});
  // medals shelf
  if(medals.length){
    html+='<div class="sectitle">Plus belles médailles</div>';
    html+='<div class="card" style="display:flex;flex-wrap:wrap;gap:10px">';
    medals.forEach(function(x){html+=medalChip(x.m,34);});html+='</div>';
  }
  // stats strip
  var topDom=dp[0]?domById[dp[0].d.id].label:"—";
  var goldCount=medals.filter(function(x){return x.m==="gold"||x.m==="diamond";}).length;
  html+='<div class="card" style="display:flex;align-items:center;margin-top:16px">'+
    stat(doneCount,"validés")+divider()+stat(goldCount,"or / 💎")+divider()+stat(topDom,"domaine #1",true)+'</div>';
  html+='<button class="ghost" data-action="tab" data-id="stats">Voir les stats détaillées '+IC.chev("var(--dim)",16)+'</button>';
  return html;
}
function stat(n,l,small){return '<div style="flex:1;text-align:center"><div style="font-size:'+(small?14:20)+'px;font-weight:700">'+
  n+'</div><div style="font-size:10.5px;color:var(--faint);margin-top:2px">'+l+'</div></div>';}
function divider(){return '<div style="width:1px;height:30px;background:var(--border)"></div>';}

function viewDomaines(){
  var p=state.progress,html='<h1>Domaines</h1><div class="grid">';
  DOMAINS.forEach(function(d){
    var objs=OBJECTIVES.filter(function(o){return o.d===d.id;});
    var done=objs.filter(function(o){return p[o.id]&&p[o.id].done;}).length;
    var ratio=objs.length?done/objs.length:0;var title=d.active?currentTitle(d.id,p):null;
    html+='<button class="dcard" '+(d.active?'data-action="open-domain" data-id="'+d.id+'"':'disabled')+'>'+
      '<div class="swatch" style="background:'+d.accent+'22"><i style="background:'+d.accent+'"></i></div>'+
      '<div style="font-size:15px;font-weight:700">'+d.label+'</div>'+
      '<div style="font-size:11.5px;font-weight:600;margin-bottom:auto;color:'+(title?d.accent:'var(--faint)')+'">'+
        (d.active?(title||"—"):"Bientôt")+'</div>'+
      (d.active?('<div style="margin-top:10px">'+bar(ratio,d.accent)+
        '<div style="font-size:11px;color:var(--dim);margin-top:5px">'+done+'/'+objs.length+' validés</div></div>'):'')+
      '</button>';});
  html+='</div>';return html;
}

function viewDomain(){
  var p=state.progress,d=domById[state.domain],groups=GROUP_ORDER[state.domain]||[];
  var title=currentTitle(d.id,p);
  var html='<button class="ghost" style="width:auto;justify-content:flex-start;padding:6px 0;margin:0 0 4px;border:none" '+
    'data-action="back-domains">'+IC.back("var(--dim)",16)+' Domaines</button>';
  html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><h1 style="margin:0">'+d.label+'</h1>'+
    (title?'<span class="pill" style="color:'+d.accent+';background:'+d.accent+'1E">'+title+'</span>':'')+'</div>';
  groups.forEach(function(g){
    var objs=OBJECTIVES.filter(function(o){return o.d===state.domain&&o.group===g;});
    if(!objs.length)return;var leg=(g==="Légendaire");
    html+='<div style="margin-bottom:26px"><div style="font-size:11.5px;letter-spacing:1px;color:var(--faint);'+
      'font-weight:700;margin-bottom:12px">'+(leg?"★ HORIZON":g.toUpperCase())+'</div>';
    objs.forEach(function(o,i){html+=treeNode(o,p,d.accent,i===0);});
    html+='</div>';});
  return html;
}
function treeNode(o,p,accent,first){
  var st=statusOf(o,p),pc=pctOf(o,p),done=st==="completed",locked=st==="locked",
    active=(st==="available"||st==="in_progress");
  var bc=active?accent:(done?accent+"55":"#20202A");
  var h='<div class="node">';
  if(!first)h+='<span class="link" style="background:'+(done?accent:"var(--border)")+'"></span>';
  h+='<button class="nodebtn" style="border-color:'+bc+';background:'+(done?accent+"14":"var(--surface)")+
     ';opacity:'+(locked?".5":"1")+'" '+(active?'data-action="open-sheet" data-id="'+o.id+'"':'disabled')+'>';
  var dotbg=done?accent:(locked?"#1A1A22":accent+"22");
  h+='<span class="dot" style="background:'+dotbg+';'+(active?'border:2px solid '+accent:'')+'">'+
     (done?IC.check("#0B0B10",16):locked?IC.lock("var(--faint)",14):IC.target(accent,15))+'</span>';
  h+='<span style="flex:1;min-width:0"><span style="display:block;font-size:14.5px;font-weight:600;color:'+
     (locked?"var(--dim)":"var(--text)")+'">'+o.title+'</span>';
  if(o.type==="metric"&&!done&&!locked){h+='<span style="display:block;margin-top:6px">'+bar(pc,accent)+
     '<span style="display:block;font-size:11px;color:var(--dim);margin-top:4px">'+
     fmt((p[o.id]&&p[o.id].value)||0,o.unit)+' / '+fmt(o.target,o.unit)+' · '+Math.round(pc*100)+'%</span></span>';}
  if(locked)h+='<span style="display:block;font-size:11px;color:var(--faint);margin-top:2px">Verrouillé</span>';
  h+='</span>';
  if(done)h+=medalChip(p[o.id].medal);
  if(active)h+=IC.chev(accent,18);
  h+='</button></div>';
  return h;
}

function viewStats(){
  var p=state.progress,gp=globalPct(p);
  var byTier=[1,2,3,4,5].map(function(t){var objs=OBJECTIVES.filter(function(o){return o.tier===t;});
    return{t:t,done:objs.filter(function(o){return p[o.id]&&p[o.id].done;}).length,total:objs.length};});
  var mc=MRANK.map(function(m){return{m:m,n:OBJECTIVES.filter(function(o){return p[o.id]&&p[o.id].medal===m;}).length};});
  var html='<h1>Stats</h1>';
  html+='<div class="card" style="margin-top:14px"><div style="font-size:12px;color:var(--dim);font-weight:600;margin-bottom:8px">PROGRESSION GLOBALE</div>'+
    bar(gp,"var(--accent)")+'<div style="font-size:13px;margin-top:8px;font-weight:600">'+Math.round(gp*100)+
    '% du chemin total (pondéré par difficulté)</div></div>';
  html+='<div class="sectitle">Médailles</div><div class="card" style="display:flex;gap:10px">';
  mc.forEach(function(x){html+='<div style="flex:1;text-align:center">'+medalChip(x.m,30)+
    '<div style="font-size:18px;font-weight:700;margin-top:6px">'+x.n+'</div>'+
    '<div style="font-size:10.5px;color:var(--faint)">'+MEDAL[x.m].label+'</div></div>';});
  html+='</div>';
  html+='<div class="sectitle">Par difficulté (tier)</div><div class="card">';
  byTier.forEach(function(x){html+='<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">'+
    '<span style="color:var(--dim)">Tier '+x.t+'</span><span style="font-weight:600">'+x.done+'/'+x.total+'</span></div>'+
    bar(x.total?x.done/x.total:0,"var(--accent)")+'</div>';});
  html+='</div>';
  return html;
}

function viewProfil(){
  var p=state.progress,gt=currentTitle("global",p);
  var rows=[["Titre global",gt||"—"],["Domaines actifs","Business · Finances"],
    ["Stockage","Local (cet appareil)"],["Sync externe","Aucune (100% manuel)"]];
  var html='<h1>Profil</h1><div class="card" style="margin-top:14px">';
  rows.forEach(function(r,i){html+='<div style="display:flex;justify-content:space-between;padding:11px 0;'+
    (i<rows.length-1?'border-bottom:1px solid var(--border)':'')+'">'+
    '<span style="color:var(--dim);font-size:13.5px">'+r[0]+'</span>'+
    '<span style="font-size:13.5px;font-weight:600">'+r[1]+'</span></div>';});
  html+='</div>';
  html+='<button class="card" data-action="reset" style="margin-top:12px;width:100%;text-align:center;color:#FF6B6B;font-weight:600;font-size:14px">Réinitialiser la progression</button>';
  html+='<div style="font-size:12.5px;color:var(--faint);line-height:1.6;margin-top:16px">Ta progression est sauvegardée sur cet appareil. Ajoute la page à ton écran d\'accueil pour un lancement plein écran comme une vraie app.</div>';
  return html;
}

function viewSheet(){
  var o=objById[state.sheet];if(!o)return"";
  var accent=domById[o.d].accent,cur=(state.progress[o.id]&&state.progress[o.id].value);
  var start=(cur!=null?cur:(o.type==="metric"?o.target:""));
  var h='<div class="sheetwrap"><div class="scrim" data-action="close-sheet"></div><div class="sheet">';
  h+='<div style="display:flex;align-items:flex-start;margin-bottom:6px"><div style="flex:1">'+
     '<div style="font-size:11px;color:'+accent+';font-weight:700;letter-spacing:.5px">'+
     domById[o.d].label.toUpperCase()+' · '+o.group+'</div>'+
     '<div style="font-size:21px;font-weight:700;margin-top:2px">'+o.title+'</div></div>'+
     '<button class="iconbtn" data-action="close-sheet">'+IC.x("var(--dim)",17)+'</button></div>';
  if(o.type==="metric"){
    h+='<div style="font-size:13px;color:var(--dim);margin-bottom:14px">Objectif : '+fmt(o.target,o.unit)+'</div>'+
       '<div style="font-size:11px;color:var(--faint);margin-bottom:6px;font-weight:700">VALEUR ACTUELLE</div>'+
       '<input type="number" id="sheetInput" value="'+start+'" inputmode="numeric">'+
       '<div id="medalPreview" style="margin-top:14px"></div>';
  }else{
    h+='<div style="font-size:14px;color:var(--dim);line-height:1.5">Accomplissement one-shot. Validé une fois, il reste acquis définitivement.</div>';
  }
  h+='<button class="primary" id="validateBtn" data-action="validate" data-id="'+o.id+'"></button>';
  h+='</div></div>';
  return h;
}

/* ============================ RENDER ============================ */
var app=document.getElementById("app"),overlay=document.getElementById("overlay");
function render(){
  var content="";
  if(state.tab==="home")content=viewHome();
  else if(state.tab==="domaines")content=state.domain?viewDomain():viewDomaines();
  else if(state.tab==="stats")content=viewStats();
  else if(state.tab==="profil")content=viewProfil();
  var navItems=[["home","🏆","Accueil"],["domaines","🗺️","Domaines"],["stats","📊","Stats"],["profil","⚙️","Profil"]];
  var nav='<div class="nav">'+navItems.map(function(n){return '<button class="'+(state.tab===n[0]?"on":"")+
    '" data-action="tab" data-id="'+n[0]+'"><span class="ic">'+n[1]+'</span>'+n[2]+'</button>';}).join("")+'</div>';
  app.innerHTML='<div class="content">'+content+'</div>'+nav+(state.sheet?viewSheet():"");
  if(state.sheet)wireSheet();
}

function wireSheet(){
  var o=objById[state.sheet];var btn=document.getElementById("validateBtn");
  var inp=document.getElementById("sheetInput");
  function refresh(){
    var accent=domById[o.d].accent;
    if(o.type==="event"){btn.style.background=accent;btn.style.color="#0B0B10";
      btn.textContent="Valider l'accomplissement";return;}
    var num=Number(inp.value)||0,willDo=num>=o.target,med=willDo?medalForValue(o,num):null;
    btn.style.background=willDo?accent:"var(--surface2)";btn.style.color=willDo?"#0B0B10":"var(--text)";
    btn.style.border=willDo?"none":"1px solid var(--border)";
    btn.textContent=willDo?("Valider · "+(med?MEDAL[med].label:"")):"Mettre à jour la valeur";
    var pv=document.getElementById("medalPreview");
    pv.innerHTML=med?(medalChip(med,26)+'<span style="font-size:13px;color:var(--dim);margin-left:8px;vertical-align:middle">Médaille : <b style="color:'+MEDAL[med].color+'">'+MEDAL[med].label+'</b></span>'):"";
  }
  if(inp)inp.addEventListener("input",refresh);
  refresh();
}

/* ============================ ACTIONS ============================ */
function doValidate(id){
  var o=objById[id];if(!o)return;var prev=state.progress;var before=unlockedTitleIds(prev);
  var becameDone=false,entry;
  if(o.type==="event"){entry={done:true,medal:"bronze"};becameDone=!(prev[id]&&prev[id].done);}
  else{var inp=document.getElementById("sheetInput");var v=Number(inp?inp.value:0)||0;
    if(v>=o.target){entry={done:true,medal:medalForValue(o,v),value:v};becameDone=!(prev[id]&&prev[id].done);}
    else{entry={value:v};}}
  prev[id]=Object.assign({},prev[id],entry);
  if(becameDone){state.log=[id].concat(state.log).slice(0,12);
    var after=unlockedTitleIds(prev);var gained=after.filter(function(t){return before.indexOf(t)<0;});
    var label=gained.length?(TITLES.filter(function(t){return t.id===gained[gained.length-1];})[0]||{}).label:null;
    celebrate(label);}
  state.sheet=null;persist();render();
}
function celebrate(title){
  try{if(navigator.vibrate)navigator.vibrate(30);}catch(e){}
  var cols=["#7C6BFF","#35C08A","#E0B341","#5FD3E8","#FF6B6B"];
  var c=document.createElement("div");c.className="confetti";
  for(var i=0;i<18;i++){var s=document.createElement("span");
    s.style.background=cols[i%cols.length];
    s.style.setProperty("--x",((Math.random()-.5)*260)+"px");
    s.style.setProperty("--y",(-Math.random()*220-40)+"px");
    s.style.animationDelay=(i*10)+"ms";c.appendChild(s);}
  overlay.appendChild(c);setTimeout(function(){overlay.removeChild(c);},1200);
  if(title){var t=document.createElement("div");t.className="toast";
    t.innerHTML='<span style="font-size:26px">👑</span><div><div class="k">NOUVEAU TITRE</div><div class="v">« '+title+' »</div></div>';
    overlay.appendChild(t);setTimeout(function(){t.style.transition="opacity .3s";t.style.opacity="0";
      setTimeout(function(){if(t.parentNode)overlay.removeChild(t);},300);},2400);}
}

app.addEventListener("click",function(e){
  var el=e.target.closest("[data-action]");if(!el)return;
  var a=el.getAttribute("data-action"),id=el.getAttribute("data-id");
  if(a==="tab"){state.tab=id;if(id!=="domaines")state.domain=null;state.sheet=null;render();}
  else if(a==="open-domain"){state.tab="domaines";state.domain=id;render();document.querySelector(".content").scrollTop=0;}
  else if(a==="back-domains"){state.domain=null;render();}
  else if(a==="open-sheet"){state.sheet=id;render();}
  else if(a==="close-sheet"){state.sheet=null;render();}
  else if(a==="validate"){doValidate(id);}
  else if(a==="reset"){if(confirm("Repartir de l'état initial ?")){state.progress=JSON.parse(JSON.stringify(INITIAL));
    state.log=INITIAL_LOG.slice();persist();render();}}
});

/* ============================ PWA (icône + manifest) ============================ */
(function(){try{
  var cv=document.createElement("canvas");cv.width=cv.height=512;var g=cv.getContext("2d");
  g.fillStyle="#0B0B10";g.fillRect(0,0,512,512);
  g.beginPath();g.arc(256,256,150,0,Math.PI*2);g.lineWidth=26;g.strokeStyle="#2A2A36";g.stroke();
  g.beginPath();g.arc(256,256,150,-Math.PI/2,Math.PI*1.05);g.lineWidth=26;g.strokeStyle="#7C6BFF";g.lineCap="round";g.stroke();
  g.font="bold 150px -apple-system,sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText("🏆",256,266);
  var url=cv.toDataURL("image/png");
  document.getElementById("appleicon").href=url;
  var man={name:"Goal App",short_name:"Goal App",display:"standalone",background_color:"#0B0B10",
    theme_color:"#0B0B10",start_url:".",icons:[{src:url,sizes:"512x512",type:"image/png"}]};
  var blob=new Blob([JSON.stringify(man)],{type:"application/manifest+json"});
  document.getElementById("manifest").href=URL.createObjectURL(blob);
}catch(e){}})();

render();
</script>
</body>
